<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>


<body>

    <h1>My Task Manager</h1>

    <p>Welcome to your personal task management application!</p>

    <div class="task-container">

        <h2>Add a New Task</h2>

        <form action="/add" method="POST">
            <input type="text" name="task" placeholder="Enter your task..." required >

            <button type="submit">Add Task</button>
        </form>

    </div>

    <h2>My Tasks</h2>

    <ul>
        {% for task in tasks %}
        <li>
            <span>{{ task['task'] }}</span>

            <a href="{{ url_for('delete_task', task_id=task['id']) }}">
                <button type="button">Delete</button>
            </a>

            <button type="button" onclick="toggleEdit({{ task['id'] }})">
                Edit
            </button>

            <form id="edit-form-{{ task['id'] }}" action="{{ url_for('edit_task', task_id=task['id']) }}" method="POST"
                style="display: none;">
                <input type="text" name="task" value="{{ task['task'] }}" required>

                <button type="submit">Save</button>

                <button type="button" onclick="toggleEdit({{ task['id'] }})">
                    Cancel
                </button>
            </form>
        </li>
        {% endfor %}
    </ul>

    <script>
        function toggleEdit(taskId) {
            const form = document.getElementById("edit-form-" + taskId);

            if (form.style.display === "none") {
                form.style.display = "block";
            } else {
                form.style.display = "none";
            }
        }
    </script>

</body>


</html>
